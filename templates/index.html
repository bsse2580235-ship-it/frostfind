<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrostFind – Find Water Before You Travel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/style.css">
<script>document.documentElement.setAttribute('data-bs-theme',localStorage.theme||'dark')</script></head>
<body>
<aside id="side"><div class="brand"><i class="fa-solid fa-snowflake"></i> FrostFind</div><nav id="nav" aria-label="Main"></nav></aside>
<div id="shell">
<header class="top">
 <button class="btn btn-sm btn-ghost d-lg-none" id="burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
 <input id="gsearch" class="form-control form-control-sm" placeholder="Search a source or place" aria-label="Search">
 <div class="ms-auto d-flex gap-2 align-items-center">
  <button class="btn btn-sm btn-ghost" id="lang" aria-label="Language">اردو / EN</button>
  <button class="btn btn-sm btn-ghost" id="theme" aria-label="Toggle theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
  <a class="btn btn-sm btn-ghost" href="#notifs" aria-label="Notifications"><i class="fa-solid fa-bell"></i></a>
  <div class="dropdown"><button class="btn btn-sm btn-ghost" data-bs-toggle="dropdown"><i class="fa-solid fa-user"></i> {{ user.name }}</button>
   <ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="#settings">Profile & settings</a></li><li><a class="dropdown-item" href="/logout">Log out</a></li></ul></div>
 </div></header>
<div id="banner"></div>
<main id="view" tabindex="-1"></main></div>
<div class="modal fade" id="m" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body" id="mb"></div></div></div></div>
<div id="toasts"></div>
<script>window.U={{ user|tojson }};</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="/static/app.js"></script></body></html>
